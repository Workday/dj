# Trino 484 rejects a local:// URI for local.location but accepts a plain path there.
# default-warehouse-dir needs the local:// scheme so table file locations resolve.
connector.name=iceberg
iceberg.catalog.type=jdbc
iceberg.jdbc-catalog.catalog-name=development
iceberg.jdbc-catalog.driver-class=org.postgresql.Driver
iceberg.jdbc-catalog.connection-url=jdbc:postgresql://postgres:5432/iceberg
iceberg.jdbc-catalog.connection-user=iceberg
iceberg.jdbc-catalog.connection-password=iceberg
iceberg.jdbc-catalog.default-warehouse-dir=local:///data/warehouse
fs.local.enabled=true
local.location=/data/warehouse
